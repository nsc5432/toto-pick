# 최적 알고리즘 탐색 파이프라인 설정.
# goal 은 "목표치 달성 여부"의 기준선 — 탐색을 돌리기 전에 미리 선언해 두는 값이며,
# 결과가 실망스럽다고 사후에 낮추면 판정 자체가 무의미해집니다.
research:
  goal:
    # 목표는 "시장 기대 대비 초과수익"입니다 (2026-08-16 재정의, statistical-model-design.md §12).
    #
    # de-vig 항등식상 어느 면을 고르든 한 다리의 기대수익은 정확히 1/O - 1 이고, 실측 오버라운드
    # O = 1.1529 이므로 -13.26% 입니다. 세 방향 무조건 베팅 실측(-13.5/-10.8/-13.8%)이 이를 확인했습니다.
    # 즉 "기술 0"의 성적표가 배당만으로 정확히 계산되므로, 그것을 빼고 남는 것이 곧 전략의 기여분입니다.
    #
    # 절대 수익률을 목표로 두면 "돈을 벌었나"와 "정보가 있었나"가 섞입니다. 마진 15.3% 시장에서
    # 앞의 답은 거의 항상 '아니오'이고, 그건 뒤의 질문에 대해 아무것도 말해주지 않습니다.
    # 초과수익은 다리 수에도 자동 정규화됩니다 — 다리가 늘면 실적과 기준선이 함께 내려갑니다.
    # 측정은 조합(슬립)이 아니라 **다리(leg)** 단위로 합니다. 조합 단위 초과수익은 노이즈가 너무
    # 큽니다 — 같은 경기를 그대로 베팅하고 묶는 방식만 2다리/3다리로 바꿔도 부호가 뒤집힙니다
    # (FAVORITE: -14.3% vs +12.0%). 다리 단위는 표본이 2~3배이고 묶기 방식의 영향이 아예 없습니다.
    min-excess-return: 0.02    # 실용 하한 — 통계적으로 깨끗해도 2%p 미만은 성과로 부르지 않음
    #
    # 유의성 요구. 고정 임계값만으로는 목표가 될 수 없습니다: 다리 300개면 노이즈만으로 ±7%p,
    # 900개면 ±4%p 이므로 같은 +5%p 가 표본에 따라 전혀 다른 의미입니다. t >= 2 를 함께 걸면
    # 자주 베팅해 작은 엣지를 입증하든, 드물게 베팅해 큰 엣지를 보이든 둘 다 길이 열립니다.
    min-excess-t-stat: 2.0
    # target-profit-rate: 0.10 # 선택 — 절대 수익률 목표. 초과수익 엣지가 확인되면 그때 복원할 값
    min-slip-count: 100        # 이 미만이면 운으로 나온 수치 — 순위에서 실격 처리
    min-betting-day-count: 20
    # 안정성 관문. 검증 구간의 "합계"만 보면 마지막 2주의 고배당 연속 적중 하나로 목표를 통과할 수
    # 있습니다 — 실제로 통과한 사례가 §10에 기록돼 있습니다. 진짜 엣지는 두 구간 모두에서 보입니다.
    # 절대 격차가 아니라 σ로 재는 이유는 목표치와 같습니다: 절대값은 표본 크기를 못 봅니다
    # (같은 0.17 이 어떤 후보에겐 2.0σ, 다른 후보에겐 2.2σ 입니다).
    max-train-validation-gap-t-stat: 2.0
    # max-train-validation-gap: 0.30 # 선택 — 절대 격차 상한(보조)
    # min-profitable-segments: 3 # 선택 — 검증 구간을 4등분했을 때 수익 구간 최소 개수
    # min-hit-rate: 0.20       # 선택 — 지정 시에만 판정
    # max-drawdown: 500000     # 선택 — 누적 손익 최대 낙폭(원) 한도
  search:
    train-ratio: 0.7                  # 앞 70% 일자로 파라미터 선택, 뒤 30%로 검증
    max-candidates-per-algorithm: 200 # 격자가 이보다 크면 시드 고정 랜덤 샘플링
    validation-top-k: 5               # 학습 상위 5개만 검증 구간에서 재측정
    seed: 42                          # 고정 — 기록된 탐색을 그대로 재현하기 위해
  ledger:
    path: research/experiments.jsonl  # 실험 원장 (append-only)
